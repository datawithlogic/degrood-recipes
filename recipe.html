<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe — TacoTown Recipes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23e8794a'%3E%3Cpolygon points='5,9 4,2 11,6'/%3E%3Cpolygon points='19,9 20,2 13,6'/%3E%3Ccircle cx='12' cy='11' r='6.5'/%3E%3Cpath d='M5.5,22 C5.5,16 8,13 12,13 C16,13 18.5,16 18.5,22 Z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="index.html">
      <svg class="logo-cat" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="5,9 4,2 11,6"/>
        <polygon points="19,9 20,2 13,6"/>
        <circle cx="12" cy="11" r="6.5"/>
        <path d="M5.5,22 C5.5,16 8,13 12,13 C16,13 18.5,16 18.5,22 Z"/>
        <path d="M18.3,21.5 C22,21.5 23,17.8 21.4,15.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      TacoTown <span>Recipes</span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="9" r="6"/><line x1="15" y1="15" x2="19" y2="19"/>
      </svg>
      <input class="search-input" id="searchInput" type="search" placeholder="Search recipes…" autocomplete="off">
    </div>
  </div>
</header>

<main class="recipe-page" id="recipePage">
  <div id="loading" style="text-align:center;padding:80px 20px;color:#9c8a7d;font-size:1rem;">Loading…</div>
</main>

<script src="data/recipes.js"></script>
<script>
/* ═══ Scaling engine ═══════════════════════════════════════════════════ */

const SCALE_OPTIONS = [
  { value: 0.5,  label: '½× — half batch' },
  { value: 1,    label: '1× — original'   },
  { value: 1.5,  label: '1.5×'            },
  { value: 2,    label: '2× — double'     },
  { value: 3,    label: '3× — triple'     },
];

const FRACTIONS = {
  '½':1/2, '⅓':1/3, '⅔':2/3, '¼':1/4, '¾':3/4, '⅕':1/5, '⅖':2/5,
  '⅗':3/5, '⅘':4/5, '⅙':1/6, '⅚':5/6, '⅛':1/8, '⅜':3/8, '⅝':5/8, '⅞':7/8,
};
const FRAC_CHARS  = Object.keys(FRACTIONS).join('');
const NUM_SRC     = `(?:\\d+(?:\\.\\d+)?(?:\\s*[${FRAC_CHARS}])?|[${FRAC_CHARS}])`;

/* Nice output fractions, ordered by preference */
const FRAC_OUT = [
  [1,2,'½'],[1,3,'⅓'],[2,3,'⅔'],[1,4,'¼'],[3,4,'¾'],
  [1,8,'⅛'],[3,8,'⅜'],[5,8,'⅝'],[7,8,'⅞'],[1,6,'⅙'],[5,6,'⅚'],
];

/* Singular count-nouns worth pluralizing when a quantity crosses 1 */
const PLURALS = {
  can:'cans', clove:'cloves', stalk:'stalks', slice:'slices', sprig:'sprigs',
  ear:'ears', head:'heads', stick:'sticks', loaf:'loaves', bunch:'bunches',
  sheet:'sheets', package:'packages', packet:'packets', egg:'eggs',
  strip:'strips', ladle:'ladles', piece:'pieces', ball:'balls',
  cup:'cups', pound:'pounds', ounce:'ounces', quart:'quarts', pint:'pints',
  gallon:'gallons', tortilla:'tortillas', noodle:'noodles', breast:'breasts',
  thigh:'thighs', onion:'onions', carrot:'carrots', potato:'potatoes',
};

const SINGULARS = Object.fromEntries(Object.entries(PLURALS).map(([s, p]) => [p, s]));

/* If the quantity is immediately followed by one of these, it describes a
   physical dimension (oil depth, slice thickness, pan size) — never scale it. */
const DIMENSION_WORDS = /^(inch|inches|in|cm|mm|deep|thick|thickness|diameter|wide|long|tall|["'″])/i;

/* Parse "1½", "¾", "10.5", "2" → Number (or null) */
function parseNum(s) {
  if (!s) return null;
  s = s.trim();
  let total = 0, matched = false;
  const whole = s.match(/^\d+(?:\.\d+)?/);
  if (whole) { total += parseFloat(whole[0]); s = s.slice(whole[0].length).trim(); matched = true; }
  if (s && FRACTIONS[s[0]] !== undefined) { total += FRACTIONS[s[0]]; matched = true; }
  return matched ? total : null;
}

/* Number → "1½" style string */
function fmtNum(n) {
  if (n === null || isNaN(n)) return '';
  const whole = Math.floor(n + 1e-9);
  const frac  = n - whole;
  if (frac < 0.02) return String(whole);
  let best = null, bestErr = 0.021;
  for (const [num, den, ch] of FRAC_OUT) {
    const err = Math.abs(frac - num/den);
    if (err < bestErr) { bestErr = err; best = ch; }
  }
  if (best) return whole ? whole + best : best;
  return String(Math.round(n * 100) / 100);
}

/* Number → gram string (integers when large, decimals when small) */
function fmtGrams(n) {
  if (n >= 100) return String(Math.round(n));
  if (n >= 10)  return String(Math.round(n * 10) / 10);
  return String(Math.round(n * 100) / 100);
}

/* Scale "454 g", "1.4–1.8 kg", "~340 g" — leaves non-numeric strings alone */
function scaleGramsField(str, mult) {
  if (!str || mult === 1) return str;
  const re = /(\d+(?:\.\d+)?)(?:(\s*[–—-]\s*)(\d+(?:\.\d+)?))?/;
  const m = str.match(re);
  if (!m) return str;
  let out = fmtGrams(parseFloat(m[1]) * mult);
  if (m[3]) out += m[2] + fmtGrams(parseFloat(m[3]) * mult);
  return str.slice(0, m.index) + out + str.slice(m.index + m[0].length);
}

/* Scale the leading quantity of a practical measure, e.g. "¾ cup" → "1½ cups" */
function scalePractical(str, mult) {
  if (!str || mult === 1) return str;
  const re = new RegExp(`(${NUM_SRC})(?:(\\s*[–—-]\\s*)(${NUM_SRC}))?`);
  const m  = str.match(re);
  if (!m) return str;

  const v1 = parseNum(m[1]);
  if (v1 === null) return str;

  /* Bail out if this number describes a dimension rather than a quantity */
  const trailing = str.slice(m.index + m[0].length).replace(/^[\s–—-]+/, '');
  if (DIMENSION_WORDS.test(trailing)) return str;

  const scaled1 = v1 * mult;
  let out = fmtNum(scaled1);
  let finalVal = scaled1;

  if (m[3]) {
    const v2 = parseNum(m[3]);
    if (v2 !== null) { out += m[2] + fmtNum(v2 * mult); finalVal = v2 * mult; }
  }

  let rest = str.slice(m.index + m[0].length);

  /* Match the following count-noun to the new quantity */
  rest = rest.replace(/^(\s+)([a-z]+)/i, (full, sp, word) => {
    const key = word.toLowerCase();
    if (finalVal > 1  && PLURALS[key])   return sp + PLURALS[key];
    if (finalVal <= 1 && SINGULARS[key]) return sp + SINGULARS[key];
    return full;
  });

  return str.slice(0, m.index) + out + rest;
}

/* Scale gram/kg amounts embedded in prose. Skips "N g each" and "N g per". */
function scaleGramsInText(text, mult) {
  if (!text || mult === 1) return text;
  const re = /(\d+(?:\.\d+)?)(?:(\s*[–—-]\s*)(\d+(?:\.\d+)?))?(\s*)(kg|grams|gram|g)\b/g;
  return text.replace(re, (match, n1, sep, n2, sp, unit, offset) => {
    const after = text.slice(offset + match.length, offset + match.length + 14);
    if (/^\s*(each|per\b|apiece)/i.test(after)) return match;   // per-portion amount
    let out = fmtGrams(parseFloat(n1) * mult);
    if (n2) out += sep + fmtGrams(parseFloat(n2) * mult);
    return out + sp + unit;
  });
}

/* ═══ Page state ═══════════════════════════════════════════════════════ */

let currentRecipe = null;
let scale = 1;

function getParams() { return new URLSearchParams(window.location.search); }

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══ Builders ═════════════════════════════════════════════════════════ */

function buildIngredientRows(ingredients, mult) {
  return ingredients.map(ing => {
    if (ing.section) {
      return `<tr class="ingredient-section"><td colspan="3">${escHtml(ing.section)}</td></tr>`;
    }
    if (ing.note) {
      return `<tr><td colspan="3"><div class="ingredient-note">${escHtml(scaleGramsInText(ing.note, mult))}</div></td></tr>`;
    }
    return `
      <tr>
        <td>${escHtml(scaleGramsField(ing.grams || '', mult))}</td>
        <td>${escHtml(scalePractical(ing.practical || '', mult))}</td>
        <td>${escHtml(ing.item || '')}</td>
      </tr>`;
  }).join('');
}

function buildSteps(steps, mult) {
  return steps.map((step, i) => {
    const checkpoint = step.checkpoint
      ? `<div class="checkpoint">${escHtml(scaleGramsInText(step.checkpoint, mult))}</div>` : '';
    const why = step.why
      ? `<div class="why-box">${escHtml(scaleGramsInText(step.why, mult))}</div>` : '';
    return `
      <li class="step-item">
        <div class="step-num">${i + 1}</div>
        <div class="step-content">
          ${step.title ? `<div class="step-title">${escHtml(step.title)}</div>` : ''}
          <div class="step-body">${escHtml(scaleGramsInText(step.body, mult))}</div>
          ${checkpoint}
          ${why}
        </div>
      </li>`;
  }).join('');
}

function buildNotes(notes, mult) {
  if (!notes || !notes.length) return '';
  return `
    <div class="notes-section">
      <h2>Notes</h2>
      <ul class="notes-list">
        ${notes.map(n => `<li>${escHtml(scaleGramsInText(n, mult))}</li>`).join('')}
      </ul>
    </div>`;
}

function buildScaleControl(mult) {
  const opts = SCALE_OPTIONS.map(o =>
    `<option value="${o.value}" ${o.value === mult ? 'selected' : ''}>${o.label}</option>`
  ).join('');
  return `
    <div class="scale-bar">
      <label class="scale-label" for="scaleSelect">Batch size</label>
      <select class="scale-select" id="scaleSelect">${opts}</select>
      ${mult !== 1 ? `<span class="scale-flag">Scaled ${fmtNum(mult)}×</span>` : ''}
    </div>
    ${mult !== 1 ? `<p class="scale-caveat">Ingredient amounts and quantities in the steps are scaled. Pan sizes, temperatures, and cook times are unchanged — larger batches may need to be cooked in stages.</p>` : ''}`;
}

/* ═══ Render ═══════════════════════════════════════════════════════════ */

function render() {
  const recipe = currentRecipe;
  const cat    = CATEGORIES[recipe.category] || { color:'#374151', bg:'#f9fafb', emoji:'🍽' };
  const emoji  = cat.emoji || '🍽';
  document.title = `${recipe.title} — TacoTown Recipes`;

  document.getElementById('recipePage').innerHTML = `
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="3" x2="4" y2="8"/><line x1="4" y1="8" x2="10" y2="13"/></svg>
      All Recipes
    </a>

    <div class="recipe-header">
      <span class="cat-badge" style="color:${cat.color};background:${cat.bg}">${emoji} ${escHtml(recipe.category)}${recipe.subcat ? ' › ' + escHtml(recipe.subcat) : ''}</span>
      <h1>${escHtml(recipe.title)}</h1>
      ${recipe.description ? `<p class="description">${escHtml(recipe.description)}</p>` : ''}
      <button class="copy-link-btn" id="copyLinkBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 9.5a3.5 3.5 0 0 0 4.95 0l2-2a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25"/>
          <path d="M9.5 6.5a3.5 3.5 0 0 0-4.95 0l-2 2a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25"/>
        </svg>
        Copy link
      </button>
      <div class="recipe-meta-bar">
        ${recipe.yield ? `<div class="meta-item"><span class="meta-label">Yield</span><span class="meta-value">${escHtml(recipe.yield)}${scale !== 1 ? ` <em class="yield-mult">× ${fmtNum(scale)}</em>` : ''}</span></div>` : ''}
        ${recipe.time  ? `<div class="meta-item"><span class="meta-label">Time</span><span class="meta-value">${escHtml(recipe.time)}</span></div>`  : ''}
        ${recipe.skill ? `<div class="meta-item"><span class="meta-label">Skill</span><span class="meta-value">${escHtml(recipe.skill)}</span></div>` : ''}
      </div>
      ${buildScaleControl(scale)}
    </div>

    <div class="recipe-body">
      <aside class="ingredients-col">
        <p class="section-label">Ingredients</p>
        <table class="ingredients-table">
          <colgroup><col style="width:24%"><col style="width:29%"><col style="width:47%"></colgroup>
          <thead>
            <tr>
              <th>Grams</th>
              <th>Practical</th>
              <th>Ingredient</th>
            </tr>
          </thead>
          <tbody>
            ${buildIngredientRows(recipe.ingredients, scale)}
          </tbody>
        </table>
      </aside>

      <section class="steps-col">
        <p class="section-label">Method</p>
        <ol class="steps-list">
          ${buildSteps(recipe.steps, scale)}
        </ol>
        ${buildNotes(recipe.notes, scale)}
      </section>
    </div>

    <footer class="site-footer">
      Supervised by <strong>Taco</strong> &amp; <strong>Lex</strong> (aka Potato), who have never once been fed.
    </footer>
  `;

  /* Re-bind the scale select after each render */
  const sel = document.getElementById('scaleSelect');
  if (sel) {
    sel.addEventListener('change', e => {
      scale = parseFloat(e.target.value);
      syncUrl();
      render();
    });
  }
}

/* Keep ?scale= in the URL so a copied link preserves the batch size */
function syncUrl() {
  const params = getParams();
  if (scale === 1) params.delete('scale');
  else params.set('scale', String(scale));
  history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

function renderNotFound(slug) {
  document.getElementById('recipePage').innerHTML = `
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="3" x2="4" y2="8"/><line x1="4" y1="8" x2="10" y2="13"/></svg>
      All Recipes
    </a>
    <div style="text-align:center;padding:60px 20px">
      <p style="font-size:1.25rem;margin-bottom:8px">Recipe not found</p>
      <p style="color:var(--text-muted)">"${escHtml(slug)}" doesn't match any recipe slug.</p>
    </div>`;
}

/* ═══ Boot ═════════════════════════════════════════════════════════════ */

const slug   = getParams().get('slug') || '';
const recipe = RECIPES.find(r => r.slug === slug);

const urlScale = parseFloat(getParams().get('scale'));
if (SCALE_OPTIONS.some(o => o.value === urlScale)) scale = urlScale;

if (recipe) { currentRecipe = recipe; render(); }
else { renderNotFound(slug); }

/* ─── Copy link ── */
document.addEventListener('click', e => {
  const btn = e.target.closest('#copyLinkBtn');
  if (!btn) return;
  navigator.clipboard.writeText(window.location.href).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2 8 6 12 14 4"/>
      </svg>
      Copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 9.5a3.5 3.5 0 0 0 4.95 0l2-2a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25"/>
          <path d="M9.5 6.5a3.5 3.5 0 0 0-4.95 0l-2 2a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25"/>
        </svg>
        Copy link`;
    }, 2500);
  });
});

/* ─── Search redirect ── */
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    window.location.href = `index.html?q=${encodeURIComponent(e.target.value.trim())}`;
  }
});
</script>
</body>
</html>
